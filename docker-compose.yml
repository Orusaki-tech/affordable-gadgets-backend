# Backend (Django) + PostgreSQL. Use for local dev and as image source for GCP.
#
# Start:    docker compose up -d
# Stop:     docker compose down
# Logs:     docker compose logs -f web
#
# Set .env with SECRET_KEY, ALLOWED_HOSTS, CORS_ALLOWED_ORIGINS, Cloudinary, etc.
# DATABASE_URL is overridden for the web service to use host "postgres" (see below).

services:
  postgres:
    image: postgres:16-alpine
    container_name: affordable-gadgets-postgres
    environment:
      POSTGRES_USER: affordable
      POSTGRES_PASSWORD: affordable
      POSTGRES_DB: affordable_gadgets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affordable -d affordable_gadgets"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: affordable-gadgets-web
    env_file: .env
    environment:
      DATABASE_URL: postgresql://affordable:affordable@postgres:5432/affordable_gadgets
      PORT: "8000"
      DJANGO_SETTINGS_MODULE: store.settings_production
      DJANGO_ENV: production
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_metrics
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Cloudflare Tunnel (replaces ngrok). Run this on the VM to expose the API over HTTPS
  # without opening inbound ports. Requires CLOUDFLARE_TUNNEL_TOKEN in the environment.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: affordable-gadgets-cloudflared
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

  # ── Observability Stack (optional, enable via --profile monitoring) ──
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ag-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./deploy/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"

  grafana:
    image: grafana/grafana:13.0.1
    container_name: ag-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
