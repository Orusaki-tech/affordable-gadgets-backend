name: Daily KPI Report
on:
  schedule:
    - cron: '0 5 * * *'    # 05:00 UTC = 08:00 Nairobi (EAT) — at daily reset, captures previous day
  workflow_dispatch:        # manual trigger for testing

jobs:
  report:
    name: Generate and Email KPI Report
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key

      - name: Run report on monitoring VM
        id: report
        env:
          GCP_PROJECT_ID: project-07850c05-c54d-486b-80a
          GCP_ZONE: us-east1-b
          INSTANCE: affordable-gadgets-production-monitoring
          SSH_KEY_PATH: ~/.ssh/ci_deploy_key
          DJANGO_API_TOKEN: ${{ secrets.DJANGO_API_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          # Match deploy-monitoring.sh: ci_deploy_key is registered on the WIF SA's OS Login profile
          SSH_USER="${SSH_USER:-$(gcloud compute os-login describe-profile --format='value(posixAccounts[0].username)' 2>/dev/null || echo affordablegadgetske_gmail_com)}"
          echo "Using SSH user: ${SSH_USER}"

          SSH_OPTS=(
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ProxyCommand="gcloud compute start-iap-tunnel ${INSTANCE} 22 --listen-on-stdin --project=${GCP_PROJECT_ID} --zone=${GCP_ZONE}"
            -i "${SSH_KEY_PATH}"
          )

          scp "${SSH_OPTS[@]}" scripts/daily-kpi-report.py \
            "${SSH_USER}@127.0.0.1:/tmp/daily-kpi-report.py"

          # Run on VM host: reaches Prometheus :9090, Grafana :3000, and public Django API
          ssh "${SSH_OPTS[@]}" "${SSH_USER}@127.0.0.1" \
            "DJANGO_API_TOKEN='${DJANGO_API_TOKEN}' \
             GRAFANA_PASSWORD='${GRAFANA_ADMIN_PASSWORD}' \
             PROMETHEUS_URL='http://localhost:9090' \
             GRAFANA_URL='http://localhost:3000' \
             python3 /tmp/daily-kpi-report.py" \
            > /tmp/kpi-report.html

          echo "Report size: $(wc -c < /tmp/kpi-report.html) bytes"
          if [ ! -s /tmp/kpi-report.html ]; then
            echo "KPI report is empty — check SSH, API token, or service connectivity above"
            exit 1
          fi
          echo "report_path=/tmp/kpi-report.html" >> $GITHUB_ENV

      - name: Check mail config
        id: mail_check
        run: |
          if [ -n "${{ secrets.MAIL_TO }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "MAIL_TO secret not set — skipping email"
          fi

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpi-report
          path: ${{ env.report_path }}

      - name: Send email report
        if: steps.mail_check.outputs.configured == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.MAIL_PORT || '465' }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Affordable Gadgets — Daily KPI Report
          to: ${{ secrets.MAIL_TO }}
          from: Affordable Gadgets KPIs <${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}>
          html_body: file://${{ env.report_path }}
          secure: true
          ignore_cert: true
          convert_markdown: false
