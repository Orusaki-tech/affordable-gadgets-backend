# DISABLED: GCP MIGs do not cold-start. Re-enable only if moving back to Railway.
# See ci.yml for push/PR triggers, deploy-staging.yml for staging deploys.

name: Keep backend warm
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          url="${BACKEND_URL:-https://api.affordable-gadgetske.com}"
          curl -sf --max-time 60 "$url/health/" || true
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
