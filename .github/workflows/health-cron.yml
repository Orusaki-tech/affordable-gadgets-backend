# DISABLED: Monitoring is handled by Grafana dashboards + Prometheus alerts.
# Re-enable schedule only if external uptime monitoring is needed without cost.
# See deploy/docs/MONITORING.md for the observability stack.

name: Health check cron
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping staging and production API
        run: |
          staging="${STAGING_API_URL:-https://api-staging.affordable-gadgetske.com}"
          prod="${PRODUCTION_API_URL:-https://api.affordable-gadgetske.com}"
          curl -sf --max-time 30 "$staging/health/" || true
          curl -sf --max-time 30 "$prod/health/" || true
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
