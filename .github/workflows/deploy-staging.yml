# Requires: GCP WIF secrets + STAGING_API_MIG_NAME. First deploy: ansible api playbook (GCS config).
# See deploy/README-GCP-PLATFORM.md and deploy/scripts/print-github-secrets.sh
name: Deploy API staging

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGION: us-central1
  REPOSITORY: ag-api

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.REPOSITORY }}/ag-api"
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:staging-latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:staging-latest"

  migrate:
    needs: build-push
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CLOUD_SQL_MIGRATE == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Cloud SQL Proxy and migrate
        env:
          CONNECTION: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${CONNECTION}" &
          sleep 5
          pip install -r requirements.txt
          export RUN_MIGRATIONS_ON_STARTUP=0
          python manage.py migrate --noinput
        continue-on-error: true

  rolling-update:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Rolling update API MIG
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MIG_NAME: ${{ secrets.STAGING_API_MIG_NAME }}
          ZONE: ${{ secrets.GCP_ZONE }}
        run: |
          if [[ -z "${MIG_NAME}" ]]; then
            echo "STAGING_API_MIG_NAME not set; skip rolling update."
            exit 0
          fi
          gcloud compute instance-groups managed rolling-action replace "${MIG_NAME}" \
            --region="${{ env.REGION }}" \
            --project="${PROJECT_ID}" \
            --max-unavailable=1 \
            --max-surge=0

  smoke:
    needs: rolling-update
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        env:
          API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          URL="${API_URL:-https://api-staging.affordable-gadgetske.com}"
          curl -sf --max-time 30 "${URL}/health/" || echo "Smoke skipped or failed; set vars.STAGING_API_URL"
