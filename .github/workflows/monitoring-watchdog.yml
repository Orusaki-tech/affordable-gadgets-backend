name: Monitoring uptime watchdog
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: monitoring-watchdog
  cancel-in-progress: false

env:
  GCP_VM_IP: 35.237.10.17
  GCP_VM_USER: shwariaccessories
  DEPLOY_PATH: /opt/affordable-gadgets

jobs:
  recover:
    name: Check and recover Grafana/API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    steps:
      - name: Probe public endpoints
        id: probe
        run: |
          set -euo pipefail
          API_OK=0
          GRAFANA_OK=0
          DATASOURCE_OK=0
          curl -sf --max-time 20 "https://api.affordable-gadgetske.com/health/" && API_OK=1 || true
          curl -sf --max-time 20 "https://grafana.affordable-gadgetske.com/login" && GRAFANA_OK=1 || true
          curl -sf --max-time 20 "https://api.affordable-gadgetske.com/api/inventory/analytics/datasource-health/" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('summary',{}).get('status')=='ok'" \
            && DATASOURCE_OK=1 || true
          echo "API=$API_OK GRAFANA=$GRAFANA_OK DATASOURCE=$DATASOURCE_OK"
          echo "api_ok=$API_OK" >> "$GITHUB_OUTPUT"
          echo "grafana_ok=$GRAFANA_OK" >> "$GITHUB_OUTPUT"
          echo "datasource_ok=$DATASOURCE_OK" >> "$GITHUB_OUTPUT"
          if [[ "$API_OK" -eq 1 && "$GRAFANA_OK" -eq 1 && "$DATASOURCE_OK" -eq 1 ]]; then
            echo "All endpoints healthy"
          fi

      - name: Setup SSH key
        if: steps.probe.outputs.api_ok != '1' || steps.probe.outputs.grafana_ok != '1' || steps.probe.outputs.datasource_ok != '1'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.GCP_VM_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Restart unhealthy stacks on the GCP VM
        if: steps.probe.outputs.api_ok != '1' || steps.probe.outputs.grafana_ok != '1' || steps.probe.outputs.datasource_ok != '1'
        env:
          API_OK: ${{ steps.probe.outputs.api_ok }}
          GRAFANA_OK: ${{ steps.probe.outputs.grafana_ok }}
          DATASOURCE_OK: ${{ steps.probe.outputs.datasource_ok }}
        run: |
          set -euo pipefail
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30"
          SSH="ssh -T $SSH_OPTS ${{ env.GCP_VM_USER }}@${{ env.GCP_VM_IP }}"

          if [[ "$GRAFANA_OK" != "1" ]]; then
            echo "→ Restarting monitoring on the GCP VM"
            $SSH "cd ${{ env.DEPLOY_PATH }} && sudo docker compose -f docker-compose.monitoring.yml --env-file monitoring/grafana.env up -d"
          fi

          if [[ "$API_OK" != "1" || "$DATASOURCE_OK" != "1" ]]; then
            echo "→ Restarting API on the GCP VM"
            $SSH "cd ${{ env.DEPLOY_PATH }} && sudo docker compose -f docker-compose.yml -f docker-compose.image.yml up -d --no-build --no-deps web"
          fi

          sleep 30
          API_OK=0
          GRAFANA_OK=0
          DATASOURCE_OK=0
          curl -sf --max-time 20 "https://api.affordable-gadgetske.com/health/" && API_OK=1 || true
          curl -sf --max-time 20 "https://grafana.affordable-gadgetske.com/login" && GRAFANA_OK=1 || true
          curl -sf --max-time 20 "https://api.affordable-gadgetske.com/api/inventory/analytics/datasource-health/" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('summary',{}).get('status')=='ok'" \
            && DATASOURCE_OK=1 || true
          echo "After recovery: API=$API_OK GRAFANA=$GRAFANA_OK DATASOURCE=$DATASOURCE_OK"
          [[ "$API_OK" -eq 1 && "$GRAFANA_OK" -eq 1 && "$DATASOURCE_OK" -eq 1 ]]

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
