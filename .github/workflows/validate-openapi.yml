name: Validate and Generate OpenAPI Schema

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'inventory/models.py'
      - 'inventory/serializers.py'
      - 'inventory/views.py'
      - 'store/urls.py'
      - 'requirements.txt'
      - 'openapi.yaml'
  push:
    branches: [main, master]
    paths:
      - 'inventory/models.py'
      - 'inventory/serializers.py'
      - 'inventory/views.py'
      - 'store/urls.py'
      - 'requirements.txt'
      - 'openapi.yaml'

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate OpenAPI schema
        run: python manage.py spectacular --file openapi.yaml
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Validate OpenAPI schema
        run: |
          python -c "
          import yaml
          from openapi_spec_validator import validate
          
          with open('openapi.yaml', 'r') as f:
              spec = yaml.safe_load(f)
          
          try:
              validate(spec)
              print('✓ OpenAPI schema is valid')
          except Exception as e:
              print(f'✗ OpenAPI validation failed: {e}')
              for error in e:
                  print(f'  - {error}')
              exit(1)
          "

      - name: Upload generated OpenAPI schema
        uses: actions/upload-artifact@v4
        with:
          name: openapi-generated
          path: openapi.yaml

      - name: Check for schema changes
        id: check-diff
        run: |
          if git diff --quiet openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✓ No schema changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "⚠ OpenAPI schema has changes:"
            git diff openapi.yaml | head -30
          fi

      - name: Comment on PR if schema changed
        if: steps.check-diff.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const diff = execSync('git diff openapi.yaml || true').toString();
            
            if (diff.length > 0) {
              const snippet = diff.substring(0, 300);
              const lines = diff.split('\n').length;
              const truncated = lines > 20 ? `\n\n_(${lines} total lines — download the full schema from **Actions → Artifacts → openapi-generated**)_` : '';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `### ⚠️ OpenAPI Schema Changed\n\nThis PR modifies the API schema. Ensure:\n- API clients are regenerated\n- API documentation is updated\n- Breaking changes are documented\n\n<details><summary>Show schema diff (snippet)</summary>\n\n\`\`\`diff\n${snippet}\`\`\`${truncated}\n\n</details>`
              });
            }