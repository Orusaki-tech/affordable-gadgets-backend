name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Django DB
        run: |
          python -c "
          import sys
          import time
          import psycopg
          
          db_url = sys.argv[1] # Get DATABASE_URL as argument
          
          max_attempts = 60
          for attempt in range(1, max_attempts + 1):
              try:
                  with psycopg.connect(db_url) as conn:
                      conn.close()
                  print(f'Database ready after {attempt} attempts.')
                  break
              except psycopg.OperationalError as e:
                  print(f'Attempt {attempt}/{max_attempts}: Database not ready yet - {e}')
                  time.sleep(1)
          else:
              print(f'Database not ready after {max_attempts} attempts. Exiting.')
              sys.exit(1)
          " ""${{ env.DATABASE_URL }}""

      - name: Django check
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run functional tests
        run: |
          pytest inventory/tests/test_api_functional.py -v --tb=short -m "p0 or p1" \
            --cov=inventory --cov-report=term-missing --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run contract tests
        run: |
          pytest inventory/tests/test_openapi_contract.py -v --tb=short -m "p0 or p1" \
            --cov=inventory --cov-report=term-missing --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run all tests
        run: |
          pytest inventory/tests/ -v --tb=short \
            --cov=inventory --cov-report=term-missing --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Build Docker image
        run: docker build -t ag-api:ci .
