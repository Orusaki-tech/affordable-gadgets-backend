name: CI / CD

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

env:
  REGION: us-east1
  REPOSITORY: ag-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run functional tests
        run: |
          pytest inventory/tests/test_api_functional.py -v --tb=short -m "p0 or p1" \
            --cov=inventory --cov-report=term-missing --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run contract tests
        run: |
          pytest inventory/tests/test_openapi_contract.py -v --tb=short -m "p0 or p1" \
            --cov=inventory --cov-report=term-missing --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run all tests
        run: |
          pytest inventory/tests/ -v --tb=short \
            --cov=inventory --cov-report=term-missing --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Build Docker image
        run: docker build -t ag-api:ci .

  build-and-push:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push to Artifact Registry
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.REPOSITORY }}/ag-api"
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:production-latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:production-latest"

  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Cloud SQL Proxy and migrate
        env:
          CONNECTION: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${CONNECTION}" &
          sleep 5
          pip install -r requirements.txt
          python manage.py migrate --noinput

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Trigger rolling replace on MIG
        id: roll
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MIG_NAME: ${{ secrets.PRODUCTION_API_MIG_NAME }}
        run: |
          gcloud compute instance-groups managed rolling-action replace "${MIG_NAME}" \
            --region="${{ env.REGION }}" \
            --project="${PROJECT_ID}" \
            --max-unavailable=1 \
            --max-surge=0

      - name: Create GitHub Deployment (in_progress)
        id: deployment
        run: |
          DEPLOY_ID=$(gh api \
            -X POST "repos/${{ github.repository }}/deployments" \
            -F "ref=${{ github.sha }}" \
            -F "environment=production" \
            -F "auto_merge=false" \
            -F "required_contexts[]=" \
            -F "description=Deploying API rolling update..." \
            --jq '.id')
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          gh api \
            -X POST "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
            -F "state=in_progress" \
            -F "description=Rolling replace triggered, waiting for MIG to stabilise..."
          echo "Created deployment $DEPLOY_ID"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Wait for MIG rollout to complete
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MIG_NAME: ${{ secrets.PRODUCTION_API_MIG_NAME }}
        run: |
          echo "Polling MIG until all instances are HEALTHY and stable..."
          for i in $(seq 1 60); do
            STATUS=$(gcloud compute instance-groups managed list-instances "${MIG_NAME}" \
              --region="${{ env.REGION }}" \
              --project="${PROJECT_ID}" \
              --format="value(HEALTH_STATE)" 2>/dev/null || echo "")
            UNHEALTHY=$(echo "$STATUS" | grep -cv "HEALTHY" || true)
            if [ "$UNHEALTHY" -eq 0 ] && [ -n "$STATUS" ]; then
              echo "All instances HEALTHY after ${i}0s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "TIMEOUT: MIG not stable after 10 minutes"
              gh api \
                -X POST "repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deploy_id }}/statuses" \
                -F "state=failure" \
                -F "description=Rolling replace timed out"
              exit 1
            fi
            echo "Waiting... ($i/60, unhealthy=$UNHEALTHY)"
            sleep 10
          done

      - name: Health check
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 "${API_URL:-https://api.affordable-gadgetske.com}/health/" > /dev/null 2>&1; then
              echo "Health check passed"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "FAILED: Health check never returned 200"
              exit 1
            fi
            echo "Retrying health check in 5s... ($i/12)"
            sleep 5
          done

      - name: Verify OpenAPI schema accessible
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          curl -sf --max-time 30 "${API_URL:-https://api.affordable-gadgetske.com}/openapi.yaml" > /dev/null
          echo "OpenAPI schema accessible"

      - name: Mark deployment as success
        if: success()
        run: |
          gh api \
            -X POST "repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deploy_id }}/statuses" \
            -F "state=success" \
            -F "environment=production" \
            -F "description=API deployed and healthy"
          echo "Deployment ${{ steps.deployment.outputs.deploy_id }} marked success"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mark deployment as failure
        if: failure() || cancelled()
        run: |
          gh api \
            -X POST "repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deploy_id }}/statuses" \
            -F "state=failure" \
            -F "environment=production" \
            -F "description=Deployment failed"
          echo "Deployment ${{ steps.deployment.outputs.deploy_id }} marked failure"
        env:
          GH_TOKEN: ${{ github.token }}
