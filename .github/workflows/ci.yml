name: CI / CD

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/validate-*.yml'
      - '.github/workflows/terraform-*.yml'
      - '.github/workflows/rollback-*.yml'
      - '.github/workflows/deploy-*.yml'
      - '.github/workflows/keep-warm.yml'
      - '.github/workflows/health-cron.yml'

env:
  REGION: us-east1
  REPOSITORY: ag-api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run tests
        run: |
          pytest inventory/tests/ -v --tb=short -n auto \
            --cov=inventory --cov-report=term-missing --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Build Docker image
        run: docker build -t ag-api:ci .

  build-and-push:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push to Artifact Registry
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.REPOSITORY }}/ag-api"
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:production-latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:production-latest"

  migrate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Start Cloud SQL Proxy
        env:
          CONNECTION: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          nohup ./cloud-sql-proxy "${CONNECTION}" > /tmp/proxy.log 2>&1 &
          disown
          echo "--- Waiting for proxy to start ---"
          timeout 20 bash -c 'while ! echo "" | nc -w1 127.0.0.1 5432 2>/dev/null; do echo "waiting for proxy..."; sleep 2; done && echo "Proxy TCP: CONNECTED"'
          echo "--- Proxy ready ---"

      - name: Test database connection
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PROXY_URL="${DATABASE_URL%%@*}@127.0.0.1:5432/${DATABASE_URL#*@*/}"
          echo "--- Testing psql connection via proxy (127.0.0.1) ---"
          PGCONNECT_TIMEOUT=15 psql "$PROXY_URL" -c "SELECT 1 AS connected;" -c "\conninfo"
          echo "--- psql connection OK ---"

      - name: Run Django migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SECRET_KEY: ci-migrate-key
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com
        run: |
          PROXY_URL="${DATABASE_URL%%@*}@127.0.0.1:5432/${DATABASE_URL#*@*/}"
          export DATABASE_URL="$PROXY_URL"
          pip install -r requirements.txt
          python manage.py migrate --noinput

      - name: Dump Cloud SQL Proxy logs
        if: always()
        run: cat /tmp/proxy.log

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Deploy API MIG (recreate + pull images)
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ env.REGION }}
          MIG_NAME: ${{ secrets.PRODUCTION_API_MIG_NAME }}
          SERVICE: api
          DEPLOY_CONFIG_BUCKET: ${{ secrets.DEPLOY_CONFIG_BUCKET }}
          ENV_NAME: production
        run: bash deploy/scripts/mig-recreate-deploy.sh

      - name: Log deployment completion to Cloud Logging
        run: |
          gcloud logging write production-deployment \
            "{\"event\":\"deployment_complete\",\"commit\":\"${{ github.sha }}\",\"workflow\":\"${{ github.run_id }}\",\"status\":\"success\"}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --severity=NOTICE \
            --payload-type=json


