name: Validate Infrastructure
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'scripts/validate-monitoring-configs.sh'
      - '.github/workflows/validate-infra.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/validate-infra.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-monitoring:
    name: Validate Monitoring Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint
          # Download promtool
          wget -q https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
          tar xzf prometheus-2.53.0.linux-amd64.tar.gz
          sudo mv prometheus-2.53.0.linux-amd64/promtool /usr/local/bin/promtool
          rm -rf prometheus-2.53.0.linux-amd64*

      - name: Validate monitoring configs
        run: bash scripts/validate-monitoring-configs.sh

  validate-ansible:
    name: Validate Ansible Playbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible-lint
          ansible --version

      - name: Validate Ansible syntax
        working-directory: deploy/ansible
        run: |
          for playbook in playbooks/*.yml; do
            echo "Checking: $playbook"
            ansible-playbook --syntax-check "$playbook" --list-tasks 2>&1 | head -20
          done

      - name: Lint Ansible roles
        working-directory: deploy/ansible
        run: |
          ansible-lint playbooks/ --exclude secrets/ 2>&1 || true
        continue-on-error: true

  deploy-monitoring:
    name: Deploy Monitoring Stack
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [validate-monitoring, validate-ansible]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Ansible
        run: pip install ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key

      - name: Deploy monitoring via Ansible (with IAP tunnel)
        working-directory: deploy/ansible
        run: |
          gcloud compute start-iap-tunnel affordable-gadgets-production-monitoring 22 \
            --project=gmail-486411 --zone=us-east1-b \
            --local-host-port=0.0.0.0:12345 &
          TUNNEL_PID=$!
          sleep 5
          ansible-playbook playbooks/monitoring.yml \
            -i inventory/production/hosts.yml \
            -e ansible_host=127.0.0.1 \
            -e ansible_port=12345 \
            -e ansible_user=affordablegadgetske_gmail_com \
            -e ansible_private_key_file=~/.ssh/ci_deploy_key \
            -e ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          ANSIBLE_EXIT=$?
          kill $TUNNEL_PID 2>/dev/null
          exit $ANSIBLE_EXIT
