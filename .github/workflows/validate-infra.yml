name: Validate Infrastructure
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/validate-infra.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/validate-infra.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-monitoring:
    name: Validate Monitoring Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint
          wget -q https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
          tar xzf prometheus-2.53.0.linux-amd64.tar.gz
          sudo mv prometheus-2.53.0.linux-amd64/promtool /usr/local/bin/promtool
          rm -rf prometheus-2.53.0.linux-amd64*

      - name: Validate monitoring configs
        run: bash scripts/validate-monitoring-configs.sh

  validate-ansible:
    name: Validate Ansible Playbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install ansible-lint
          ansible --version

      - name: Validate Ansible syntax
        working-directory: deploy/ansible
        run: |
          for playbook in playbooks/*.yml; do
            echo "Checking: $playbook"
            ansible-playbook --syntax-check "$playbook" --list-tasks 2>&1 | head -20
          done

      - name: Lint Ansible roles
        working-directory: deploy/ansible
        run: |
          ansible-lint playbooks/ --exclude secrets/ 2>&1 || true
        continue-on-error: true

  deploy-monitoring:
    name: Deploy Monitoring Stack
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [validate-monitoring, validate-ansible]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy monitoring stack
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          DJANGO_ADMIN_PASSWORD: ${{ secrets.DJANGO_ADMIN_PASSWORD }}
          DJANGO_API_TOKEN: ${{ secrets.DJANGO_API_TOKEN }}
          AWS_REGION: eu-north-1
          MONITORING_INSTANCE_ID: ${{ secrets.AWS_MONITORING_INSTANCE_ID }}
          API_PRIVATE_IP: ${{ secrets.AWS_API_PRIVATE_IP }}
          AWS_DEPLOY_CONFIG_BUCKET: ${{ secrets.AWS_DEPLOY_CONFIG_BUCKET }}
          DEPLOY_TUNNEL_ON_MONITORING: "1"
        run: bash deploy/scripts/deploy-monitoring.sh
