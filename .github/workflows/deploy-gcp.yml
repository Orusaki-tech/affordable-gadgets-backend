name: Deploy to GCP VM

on:
  push:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - 'deploy/archive/**'
      - '.github/workflows/validate-*.yml'
      - '.github/workflows/health-cron.yml'
      - '.github/workflows/monitoring-watchdog.yml'

env:
  GCP_VM_IP: 34.26.82.94
  GCP_VM_USER: shwariaccessories
  DEPLOY_PATH: /opt/affordable-gadgets

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Run tests
        run: |
          pytest inventory/tests/ -v --tb=short -n auto \
            --cov=inventory --cov-report=term-missing --cov-report=xml
        env:
          DJANGO_SETTINGS_MODULE: store.settings
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: postgresql://postgres:test_password@127.0.0.1:5432/test_db
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com

      - name: Build Docker image
        run: docker build -t ag-api:ci .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: production-api-deploy
      cancel-in-progress: false
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.GCP_VM_IP }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to GCP VM
        env:
          SSH_KEY: ~/.ssh/deploy_key
        run: |
          SSH_CMD="ssh -i $SSH_KEY -o StrictHostKeyChecking=no ${{ env.GCP_VM_USER }}@${{ env.GCP_VM_IP }}"

          echo "==> Configuring git safe directory..."
          $SSH_CMD "sudo git config --global --add safe.directory ${{ env.DEPLOY_PATH }}/app"

          echo "==> Pulling latest code..."
          $SSH_CMD "
            cd ${{ env.DEPLOY_PATH }}/app &&
            sudo git fetch origin main &&
            sudo git checkout -f origin/main
          "

          echo "==> Rebuilding Docker containers..."
          $SSH_CMD "
            cd ${{ env.DEPLOY_PATH }} &&
            sudo docker compose -f docker-compose.yml build web
          "

          echo "==> Restarting services..."
          $SSH_CMD "
            cd ${{ env.DEPLOY_PATH }} &&
            sudo docker compose -f docker-compose.yml up -d
          "

          echo "==> Waiting for health check..."
          sleep 30

          echo "==> Verifying deployment..."
          curl -sf --max-time 15 "http://${{ env.GCP_VM_IP }}:8000/health/" || {
            echo "Health check failed!"
            exit 1
          }

          echo "==> Deployment successful!"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
