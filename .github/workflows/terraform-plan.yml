name: Terraform plan

on:
  pull_request:
    paths:
      - "deploy/terraform/**"

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Prepare staging tfvars
        working-directory: deploy/terraform
        run: |
          if [[ ! -f environments/staging.tfvars ]]; then
            cp environments/staging.tfvars.example environments/staging.tfvars
          fi

      - name: Terraform init
        working-directory: deploy/terraform
        run: terraform init -input=false

      - name: Terraform plan staging
        working-directory: deploy/terraform
        run: terraform plan -input=false -var-file=environments/staging.tfvars -no-color
