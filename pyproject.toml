[project]
name = "affordable-gadgets-backend"
version = "0.1.0"
description = "Django REST API for Affordable Gadgets e-commerce"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2.0",
    "djangorestframework>=3.15.0",
    "django-cors-headers>=4.6.0",
    "django-filter>=25.1",
    "drf-spectacular>=0.27.0",
    "psycopg[binary]>=3.2.0",
    "gunicorn>=21.2.0",
    "sentry-sdk>=2.0.0",
    "prometheus-client>=0.20.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["venv", ".git", "migrations", "__pycache__", "build", "dist", "scripts/adhoc"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "store.settings"
python_files = ["test_*.py"]
testpaths = ["inventory/tests"]
addopts = [
    "--reuse-db",
    "--strict-markers",
    "-p", "no:cacheprovider",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "p0: highest priority critical path tests",
    "p1: high priority business logic tests",
    "p2: standard tests",
]

[tool.coverage.run]
source = ["inventory"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/management/*",
    "*/test*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if 0:",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
exclude = [
    "migrations",
    "venv",
]
