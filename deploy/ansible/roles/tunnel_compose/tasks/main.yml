---
- name: Deploy tunnel.env
  template:
    src: tunnel.env.j2
    dest: "{{ compose_root }}/tunnel.env"
    mode: "0600"
  no_log: true

- name: Deploy docker-compose.tunnel.yml
  template:
    src: docker-compose.tunnel.yml.j2
    dest: "{{ tunnel_compose_file }}"
    mode: "0644"

- name: Start tunnel
  command: docker compose -f {{ tunnel_compose_file }} --env-file {{ compose_root }}/tunnel.env up -d --force-recreate
  args:
    chdir: "{{ compose_root }}"
