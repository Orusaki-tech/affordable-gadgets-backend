---
- name: Ensure local render directory
  file:
    path: "/tmp/ag-deploy/{{ env_name }}/api"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Render api.env locally
  template:
    src: api.env.j2
    dest: "/tmp/ag-deploy/{{ env_name }}/api/api.env"
    mode: "0600"
  no_log: true
  delegate_to: localhost
  become: false

- name: Render docker-compose.api.yml locally
  template:
    src: docker-compose.api.yml.j2
    dest: "/tmp/ag-deploy/{{ env_name }}/api/docker-compose.api.yml"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Upload API config to S3
  command: >-
    aws s3 cp
    /tmp/ag-deploy/{{ env_name }}/api/api.env
    s3://{{ deploy_config_bucket }}/{{ deploy_s3_prefix | default(env_name) }}/api/api.env
  delegate_to: localhost
  become: false
  when:
    - deploy_config_bucket | length > 0

- name: Upload API docker-compose to S3
  command: >-
    aws s3 cp
    /tmp/ag-deploy/{{ env_name }}/api/docker-compose.api.yml
    s3://{{ deploy_config_bucket }}/{{ deploy_s3_prefix | default(env_name) }}/api/docker-compose.api.yml
  delegate_to: localhost
  become: false
  when:
    - deploy_config_bucket | length > 0

- name: Restart API via SSM (AWS)
  command: >-
    aws ssm send-command
    --region {{ aws_region }}
    --instance-ids {{ api_instance_id }}
    --document-name AWS-RunShellScript
    --comment "Deploy API compose"
    --parameters commands="cd {{ compose_root }} && aws s3 sync s3://{{ deploy_config_bucket }}/{{ deploy_s3_prefix | default(env_name) }}/api/ . && aws ecr get-login-password --region {{ aws_region }} | docker login --username AWS --password-stdin {{ api_image | regex_replace('/[^/]+$','') }} && docker compose -f docker-compose.api.yml pull && docker compose -f docker-compose.api.yml up -d"
  delegate_to: localhost
  become: false
  when:
    - api_instance_id | default('') | length > 0
    - aws_deploy_restart | default(true) | bool
