---
- name: Ensure local render directory
  file:
    path: "/tmp/ag-deploy/{{ env_name }}/api"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Render api.env locally
  template:
    src: api.env.j2
    dest: "/tmp/ag-deploy/{{ env_name }}/api/api.env"
    mode: "0600"
  no_log: true
  delegate_to: localhost
  become: false

- name: Render docker-compose.api.yml locally
  template:
    src: docker-compose.api.yml.j2
    dest: "/tmp/ag-deploy/{{ env_name }}/api/docker-compose.api.yml"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Upload API config to GCS
  command: >-
    gsutil -m cp
    /tmp/ag-deploy/{{ env_name }}/api/api.env
    /tmp/ag-deploy/{{ env_name }}/api/docker-compose.api.yml
    gs://{{ deploy_config_bucket }}/{{ env_name }}/api/
  delegate_to: localhost
  become: false
  when: deploy_config_bucket | length > 0

- name: Rolling restart API MIG (pick up GCS config on new instances)
  command: >-
    gcloud compute instance-groups managed rolling-action replace {{ api_mig_name }}
    --region={{ gcp_region }}
    --project={{ gcp_project_id }}
    --max-unavailable=0
    --max-surge=1
  delegate_to: localhost
  become: false
  when: api_mig_name | default('') | length > 0
  register: api_mig_roll
  changed_when: "'started' in (api_mig_roll.stdout | default('')) or api_mig_roll.rc == 0"
