apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Google Cloud Logging
    type: stackdriver
    access: proxy
    withCredentials: false
    isDefault: false
    editable: false
    jsonData:
      authenticationType: gce
      defaultProject: gmail-486411

  # Google Cloud Trace is not available as a built-in / community datasource
  # in Grafana OSS. View traces at:
  # https://console.cloud.google.com/traces?project=gmail-486411
