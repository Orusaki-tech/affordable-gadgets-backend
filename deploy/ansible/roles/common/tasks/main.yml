---
- name: Install Docker
  apt:
    name:
      - docker.io
      - docker-compose-plugin
      - curl
    state: present
    update_cache: true

- name: Enable Docker
  systemd:
    name: docker
    enabled: true
    state: started

- name: Create compose directory
  file:
    path: "{{ compose_root }}"
    state: directory
    mode: "0755"

- name: Install Google Cloud Ops Agent (logging/metrics)
  shell: |
    curl -sSO https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
    bash add-google-cloud-ops-agent-repo.sh --also-install
  args:
    creates: /etc/google-cloud-ops-agent/config.yaml
  ignore_errors: true
