[defaults]
inventory = inventory/staging
roles_path = roles
remote_user = ubuntu
private_key_file = ~/.ssh/google_compute_engine
host_key_checking = False
stdout_callback = default
# Production: ansible-playbook -i inventory/production ...

[vault]
# Encrypt secrets: ansible-vault encrypt secrets/staging.vault.yml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
