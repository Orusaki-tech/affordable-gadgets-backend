---
# Staging inventory.
# API/shop/admin deploy via GCS + MIG (playbooks on localhost). Tunnel uses IAP SSH.
all:
  children:
    bastion:
      hosts:
        bastion-01:
          ansible_host: "{{ bastion_name | default('affordable-gadgets-staging-bastion') }}"
    tunnel:
      hosts:
        affordable-gadgets-staging-tunnel:
          ansible_host: affordable-gadgets-staging-tunnel
    api:
      hosts: {}
    shop:
      hosts: {}
    admin:
      hosts: {}
