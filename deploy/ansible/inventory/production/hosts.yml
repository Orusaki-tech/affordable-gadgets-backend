---
# Populate private IPs / instance IDs from terraform output or generated_from_terraform.yml
all:
  children:
    api:
      hosts:
        ag-api-aws:
          ansible_host: 127.0.0.1
          ansible_connection: aws_ssm
          ansible_aws_ssm_instance_id: "{{ api_instance_id }}"
          ansible_aws_ssm_region: "{{ aws_region | default('eu-north-1') }}"
    monitoring:
      hosts:
        ag-monitoring-aws:
          ansible_host: 127.0.0.1
          ansible_connection: aws_ssm
          ansible_aws_ssm_instance_id: "{{ monitoring_instance_id }}"
          ansible_aws_ssm_region: "{{ aws_region | default('eu-north-1') }}"
