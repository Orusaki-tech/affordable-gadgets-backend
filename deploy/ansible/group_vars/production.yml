---
cloud_provider: aws
env_name: production
deploy_s3_prefix: production

aws_region: eu-north-1
aws_account_id: "549116505700"

# Set after terraform apply (or from generated_from_terraform.yml)
deploy_config_bucket: ""
api_instance_id: ""
monitoring_instance_id: ""
rds_endpoint: ""
api_private_ip: ""

api_image: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com/ag-api"
image_tag: production-latest

api_gunicorn_workers: 2
gunicorn_workers: 2
run_migrations_on_startup: "1"

otel_enabled: "false"

allowed_hosts: "api.affordable-gadgetske.com,www.affordable-gadgetske.com,affordable-gadgetske.com,localhost,127.0.0.1,{{ api_private_ip }},{{ monitoring_private_ip }}"
cors_allowed_origins: "https://www.affordable-gadgetske.com,https://affordable-gadgetske.com,https://affordable-gadgets-frontend.vercel.app,https://affordable-gadgets-admin.vercel.app,https://admin.affordable-gadgetske.com"
frontend_base_url: "https://www.affordable-gadgetske.com"
csrf_trusted_origins: "https://api.affordable-gadgetske.com,https://www.affordable-gadgetske.com"

pesapal_environment: production
pesapal_callback_url: "https://api.affordable-gadgetske.com/api/payments/pesapal/callback/"
pesapal_ipn_url: "https://api.affordable-gadgetske.com/api/payments/pesapal/ipn/"

prometheus_api_target: "{{ api_private_ip }}:8000"

deploy_tunnel_on_monitoring: true

common_force_docker_install: false
