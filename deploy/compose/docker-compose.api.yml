services:
  api:
    image: us-east1-docker.pkg.dev/project-07850c05-c54d-486b-80a/ag-api/ag-api:production-latest
    container_name: ag-api-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: /opt/affordable-gadgets/api.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    command: >
      sh -c "python manage.py create_default_brand --skip-checks && python manage.py collectstatic --noinput && gunicorn store.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 16 --timeout 120 --access-logfile - --error-logfile -"
