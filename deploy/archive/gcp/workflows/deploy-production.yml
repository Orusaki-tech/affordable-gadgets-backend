name: Deploy API production (manual fallback)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA or tag already in Artifact Registry (default: production-latest)'
        required: false
        default: 'production-latest'

env:
  REGION: us-east1

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CLOUD_SQL_MIGRATE == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Cloud SQL Proxy and migrate
        env:
          CONNECTION: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SECRET_KEY: ci-migrate-key
          FRONTEND_BASE_URL: https://shop.affordable-gadgetske.com
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${CONNECTION}" &
          sleep 5
          pip install -r requirements.txt
          python manage.py migrate --noinput

  promote:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Rolling update production API MIG
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MIG_NAME: ${{ secrets.PRODUCTION_API_MIG_NAME }}
        run: |
          gcloud compute instance-groups managed rolling-action replace "${MIG_NAME}" \
            --region="${{ env.REGION }}" \
            --project="${PROJECT_ID}" \
            --max-unavailable=1 \
            --max-surge=0

      - name: Smoke production health
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          curl -sf --max-time 30 "${API_URL:-https://api.affordable-gadgetske.com}/health/" || exit 0

      - name: Verify OpenAPI schema is accessible
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          curl -sf --max-time 30 "${API_URL:-https://api.affordable-gadgetske.com}/openapi.yaml" > /tmp/schema.yaml
          echo "OpenAPI schema verified"