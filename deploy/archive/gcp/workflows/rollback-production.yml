name: Rollback API production

on:
  workflow_dispatch:
    inputs:
      previous_image_tag:
        description: Git SHA to roll back to
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: actions/checkout@v4

      - name: Roll back API image and recreate MIG
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: us-east1
          MIG_NAME: ${{ secrets.PRODUCTION_API_MIG_NAME }}
          SERVICE: api
          DEPLOY_CONFIG_BUCKET: ${{ secrets.DEPLOY_CONFIG_BUCKET }}
          ENV_NAME: production
          TAG: ${{ inputs.previous_image_tag }}
        run: |
          echo "Rollback: update GCS compose to image_tag=${TAG}, then recreate MIG:"
          echo "  ansible-playbook -i deploy/ansible/inventory/production deploy/ansible/playbooks/api.yml -e image_tag=${TAG}"
          bash deploy/scripts/mig-recreate-deploy.sh

      - name: Smoke health
        run: curl -sf --max-time 30 "${{ vars.PRODUCTION_API_URL || 'https://api.affordable-gadgetske.com' }}/health/"
