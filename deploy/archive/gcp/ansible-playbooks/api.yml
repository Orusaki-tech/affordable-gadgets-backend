---
# Pushes api.env + compose to GCS; MIG startup + rolling replace pull config on boot.
- name: Deploy API to platform MIG
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all/00_system.yml
    - ../group_vars/{{ env_name | default('staging') }}.yml
    - ../vars/generated_from_terraform.yml
    - ../secrets/{{ env_name | default('staging') }}.vault.yml
  roles:
    - api_compose
