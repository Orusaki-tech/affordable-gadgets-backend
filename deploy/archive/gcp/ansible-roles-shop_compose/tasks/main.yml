---
- name: Ensure local render directory
  file:
    path: "/tmp/ag-deploy/{{ env_name }}/shop"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Render docker-compose.shop.yml locally
  template:
    src: docker-compose.shop.yml.j2
    dest: "/tmp/ag-deploy/{{ env_name }}/shop/docker-compose.shop.yml"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Upload shop compose to GCS
  command: >-
    gsutil cp
    /tmp/ag-deploy/{{ env_name }}/shop/docker-compose.shop.yml
    gs://{{ deploy_config_bucket }}/{{ env_name }}/shop/docker-compose.shop.yml
  delegate_to: localhost
  become: false
  when: deploy_config_bucket | length > 0

- name: Recreate shop MIG instances and pull images (quota-safe)
  command: "{{ role_path }}/../../../scripts/mig-recreate-deploy.sh"
  environment:
    GCP_PROJECT_ID: "{{ gcp_project_id }}"
    GCP_REGION: "{{ gcp_region }}"
    MIG_NAME: "{{ shop_mig_name }}"
    SERVICE: shop
    DEPLOY_CONFIG_BUCKET: "{{ deploy_config_bucket }}"
    ENV_NAME: "{{ env_name }}"
  delegate_to: localhost
  become: false
  when: shop_mig_name | default('') | length > 0
