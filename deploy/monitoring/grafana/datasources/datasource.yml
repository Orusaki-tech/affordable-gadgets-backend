apiVersion: 1

# Allow type migration (marcusolsson-json-datasource → infinity) on reprovision.
deleteDatasources:
  - name: JSON API
    orgId: 1
  - name: Django API
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Google Cloud Logging
    type: stackdriver
    uid: stackdriver
    access: proxy
    withCredentials: false
    isDefault: false
    editable: false
    jsonData:
      authenticationType: gce
      defaultProject: project-07850c05-c54d-486b-80a

  - name: Django API
    type: yesoreyeram-infinity-datasource
    uid: json-api
    url: https://api.affordable-gadgetske.com
    access: proxy
    basicAuth: false
    isDefault: false
    editable: true
    jsonData:
      httpHeaderName1: "Authorization"
      allowedHosts:
        - "https://api.affordable-gadgetske.com"
    secureJsonData:
      httpHeaderValue1: "Token ${GF_JSON_API_TOKEN}"

  # Google Cloud Trace is not available as a built-in / community datasource
  # in Grafana OSS. View traces at:
  # https://console.cloud.google.com/traces?project=project-07850c05-c54d-486b-80a
