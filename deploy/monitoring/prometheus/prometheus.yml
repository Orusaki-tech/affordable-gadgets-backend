global:
  scrape_interval:     15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alerts.yml'

scrape_configs:
  - job_name: 'django'
    scrape_interval: 10s
    metrics_path: /metrics/
    scheme: https
    static_configs:
      - targets: ['affordable-gadgets-backend-i2s6.onrender.com']
        labels:
          service: django-api
          instance: render

  - job_name: 'monitoring-vm'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']
