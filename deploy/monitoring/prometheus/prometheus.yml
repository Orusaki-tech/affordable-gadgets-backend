global:
  scrape_interval:     15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'django'
    scrape_interval: 10s
    metrics_path: /metrics/
    static_configs:
      - targets:
          - 'web:8000'             # docker-compose internal
          - 'host.docker.internal:8000'  # host-mode access
    # Relabel to add a `service` label
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'django-api'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
