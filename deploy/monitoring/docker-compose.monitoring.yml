# Monitoring stack: Prometheus + Grafana.
#
# Usage from project root:
#   docker compose -f deploy/monitoring/docker-compose.monitoring.yml up -d
#
# Access:
#   Prometheus → http://localhost:9090
#   Grafana    → http://localhost:3000  (admin / ${GRAFANA_PASSWORD:-admin})
#
# Source of truth: deploy/ansible/roles/monitoring_compose/
# 
# Last restarted: 2026-06-02 (fix 502 timeout issue)

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ag-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"

  grafana:
    image: grafana/grafana:13.0.1
    container_name: ag-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=marcusolsson-json-datasource
    env_file:
      - ./grafana.env
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  prometheus_data:
  grafana_data:
